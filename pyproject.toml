[project]
name = "ai-agent-mongo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AyushmanDey", email = "ayushmandey405@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "pymongo>=4.19.0",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
ai-agent-mongo = "ai_agent_mongo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
